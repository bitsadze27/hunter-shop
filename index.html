<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="contact.html">
  <title>ტყის საიდუმლო</title>
  

</head>
<body>
  <header class="site-header">

    <div class="logo"> 
      <img src="photos/logo.jpg" alt="ტყის საიდუმლო">
    </div>

    <div class="search">
      <input type="search">  
    </div>

    <div>
      <button class="cart-container"> კალათა 🛒</button> 
    
    </div> 

    <span class="delivery"> უფასო მიწოდება 500 ლარიდან</span>
  </header>
  <main>
    <h1>მთავარი პროდუქტები</h1>
    <div class="card">
      <div class="card0"> <img src="photos/arrow.jpg" alt="arrow"> 
        <h4>მშვილდი</h4>
        <p>ფასი: 1000₾</p>
        <p>მოყვება ჩანთა და ძუა</p>
      </div>
        
      <div class="card1"> <img src="photos/bag.jpg" alt="bag">
      <h4>ჩანთა</h4>
      <p>ფასი: 450₾</p>
      <p>მოყვება საძილე ტომარა</p>
      </div>

      <div class="card2"> <img src="photos/gun.jpg" alt="gun">
        <h4>სანადირო იარაღი (m24)</h4>
        <p>ფასი: 7400₾</p>
        <p>მოყვება სამიზნე</p>
      </div>

      <div class="card3"> <img src="photos/knife.jpg" alt="knife">
        <h4>სანადირო დანა</h4>
        <p>ფასი:275₾</p>
        <p>მოყვება თავისი ბუდე</p>
      </div>

    </div>
    
    <video width="640" height="460" controls autoplay muted loop src="videos/hunt.mp4"> hunt
      <source src="hunt.mp4" type="videos/hunt.mp4">
    </video>
    <audio controls autoplay muted loop src="audio/nature1.mp3"></audio>
  </main>
  <footer>
    <h3>
      დეტალური ინფორმაციისთვის ეწვიეთ მოცემულ გვერდს
    </h3>
    <div class="contact">
    
    <a href="contact.html"> კონტაქტები</a>
    
    </div>
  </footer>
</body>
</html>
